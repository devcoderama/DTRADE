name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (runtime + dev)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check modul kritis dana (mypy)
        run: mypy core/risk.py core/executor.py
      - name: Security scan (bandit)
        run: bandit -r core config web cli run.py -q
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Run tests + coverage gate risk/executor (mocked — no network, no live orders)
        run: >-
          python -m pytest tests/ -q
          --cov=core.risk --cov=core.executor --cov-report=term
          --cov-fail-under=70
