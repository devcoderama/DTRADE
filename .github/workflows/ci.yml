name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies (lockfile — Fase 6-C2)
        run: pip install -r requirements.lock
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check modul kritis dana (mypy)
        run: mypy core/risk.py core/executor.py
      - name: Security scan (bandit)
        run: bandit -r core config web cli run.py -q
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Run tests + coverage gates (mocked — no network, no live orders)
        run: |
          python -m pytest tests/ -q --cov=core --cov=config --cov=web --cov-report=json:coverage.json
          python scripts/check_coverage.py coverage.json
