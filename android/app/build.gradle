apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// Penandatanganan rilis bersifat LOKAL: bila berkas keystore.properties ada
// (ditunjuk oleh env DTRADE_KEYSTORE_PROPS, atau di folder android/),
// APK rilis ditandatangani dengannya. Berkas itu TIDAK ikut ke repo —
// lihat android/README.md. Tanpa berkas itu, build rilis tidak ditandatangani
// (build debug tetap berjalan normal).
def keystoreProps = new Properties()
def keystorePropsFile = file(System.getenv("DTRADE_KEYSTORE_PROPS") ?: "../keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.devcoderama.dtrade"
    compileSdk 34

    defaultConfig {
        applicationId "com.devcoderama.dtrade"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Fase 6-C3: minify R8 aktif untuk rilis (aplikasi WebView
            // murni tanpa refleksi — aturan bawaan cukup).
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.20"
}
